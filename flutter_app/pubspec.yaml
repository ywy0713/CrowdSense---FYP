name: crowdsense_flutter
description: CrowdSense - Real-Time Crowd Management App with AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.0.12
  cloud_firestore: ^5.4.6
  flutter_local_notifications: ^18.0.1
  firebase_storage: ^12.3.0

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Charts & Analytics
  fl_chart: ^0.69.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  http: ^1.2.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  video_player: ^2.9.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  file_picker: ^8.1.3
  url_launcher: ^6.3.1

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # Image Processing
  image: ^4.3.0
  
  # ML Kit for person detection
  google_mlkit_object_detection: ^0.11.0
  
  # WebView for displaying MJPEG streams (for external camera HTTP)
  webview_flutter: ^4.9.0
  
  # Audio playback for notifications
  audioplayers: ^6.1.0
  
  # File sharing
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true

  # Assets removed - directories don't exist
  # If you need to add assets later, create the directories and uncomment:
  # assets:
  #   - assets/images/
  #   - assets/icons/
